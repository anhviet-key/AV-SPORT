plugins {
    id "com.android.application"
}

def configuredWebUrl = (project.findProperty("AV_SPORT_WEB_URL") ?: "http://192.168.1.100:3000").toString()
def configuredApiBaseUrl = (project.findProperty("AV_SPORT_API_BASE_URL") ?: configuredWebUrl).toString()
def configuredUpdateManifestUrl = (project.findProperty("AV_SPORT_UPDATE_MANIFEST_URL") ?: "https://raw.githubusercontent.com/anhviet-key/AV-SPORT/main/app-update.json").toString()
def configuredVersionName = (project.findProperty("AV_SPORT_VERSION_NAME") ?: "1.0.0").toString()
def configuredVersionCode = (project.findProperty("AV_SPORT_VERSION_CODE") ?: "1").toString().toInteger()
def escapedWebUrl = configuredWebUrl.replace("\\", "\\\\").replace("\"", "\\\"")
def escapedApiBaseUrl = configuredApiBaseUrl.replace("\\", "\\\\").replace("\"", "\\\"")
def escapedUpdateManifestUrl = configuredUpdateManifestUrl.replace("\\", "\\\\").replace("\"", "\\\"")
def releaseKeystoreFile = project.findProperty("AV_SPORT_KEYSTORE_FILE")
def releaseKeystorePassword = project.findProperty("AV_SPORT_KEYSTORE_PASSWORD")
def releaseKeyAlias = project.findProperty("AV_SPORT_KEY_ALIAS")
def releaseKeyPassword = project.findProperty("AV_SPORT_KEY_PASSWORD")
def hasReleaseSigning =
    releaseKeystoreFile &&
    releaseKeystorePassword &&
    releaseKeyAlias &&
    releaseKeyPassword

android {
    namespace = "com.anhviet.avsport"
    compileSdk = 35

    buildFeatures {
        buildConfig = true
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    defaultConfig {
        applicationId = "com.anhviet.avsport"
        minSdk = 23
        targetSdk = 35
        versionCode = configuredVersionCode
        versionName = configuredVersionName
        buildConfigField "String", "WEB_URL", "\"${escapedWebUrl}\""
        buildConfigField "String", "API_BASE_URL", "\"${escapedApiBaseUrl}\""
        buildConfigField "String", "UPDATE_MANIFEST_URL", "\"${escapedUpdateManifestUrl}\""
        buildConfigField "String", "APP_NAME", "\"AV Sport\""
    }

    signingConfigs {
        release {
            if (hasReleaseSigning) {
                storeFile = file(releaseKeystoreFile.toString())
                storePassword = releaseKeystorePassword.toString()
                keyAlias = releaseKeyAlias.toString()
                keyPassword = releaseKeyPassword.toString()
            }
        }
    }

    buildTypes {
        debug {
            debuggable = true
        }

        release {
            debuggable = false
            minifyEnabled = false
            shrinkResources = false
            if (hasReleaseSigning) {
                signingConfig = signingConfigs.release
            } else {
                signingConfig = signingConfigs.debug
            }
        }
    }
}

dependencies {
    implementation "androidx.core:core:1.13.1"
    implementation "androidx.media3:media3-exoplayer:1.5.1"
    implementation "androidx.media3:media3-ui:1.5.1"
    implementation "androidx.recyclerview:recyclerview:1.3.2"
}
